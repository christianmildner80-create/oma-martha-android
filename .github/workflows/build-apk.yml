name: Android-APK bauen

# Baut die Oma-Martha-Android-App-Huelle automatisch bei jedem Push, komplett kostenlos ueber
# GitHub Actions - kein eigener PC mit Android Studio noetig (Christian, 19.08.2026: "da sind wir
# ja wieder im kostenpflichtigen Bereich"). Ergebnis liegt danach unter "Actions" -> der jeweilige
# Lauf -> "Artifacts" als ZIP mit der fertigen APK zum Download.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Festen Debug-Keystore einsetzen (sonst signiert jeder Build anders und Updates schlagen fehl)
        run: |
          mkdir -p ~/.android
          cp oma-martha-debug.keystore ~/.android/debug.keystore

      - name: Abhaengigkeiten installieren
        run: npm install

      - name: Android-Projekt generieren (legt android/ an)
        run: npx cap add android

      - name: Minimale Android-Version auf 23 setzen (Zebra TC75x = Android 6.0)
        run: sed -i "s/minSdkVersion = .*/minSdkVersion = 23/" android/variables.gradle

      - name: App-Icon aus assets/icon.png generieren
        run: npx @capacitor/assets generate --android

      - name: Konfiguration synchronisieren
        run: npx cap sync android

      - name: APK bauen (Debug, ungeeignet fuer Play Store aber fuer eigene Geraete ausreichend)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: oma-martha-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: APK auf festen Download-Link hochladen
        run: |
          curl -sf -X POST \
            -H "X-Upload-Secret: ${{ secrets.APK_UPLOAD_SECRET }}" \
            --data-binary @android/app/build/outputs/apk/debug/app-debug.apk \
            https://oma-martha-frankleben.de/imbiss/modules/it_soloution/apk_upload.php
