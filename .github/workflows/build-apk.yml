name: Android-APK bauen

# Baut die Oma-Martha-Android-App-Huelle automatisch bei jedem Push, komplett kostenlos ueber
# GitHub Actions - kein eigener PC mit Android Studio noetig (Christian, 19.08.2026: "da sind wir
# ja wieder im kostenpflichtigen Bereich"). Ergebnis liegt danach unter "Actions" -> der jeweilige
# Lauf -> "Artifacts" als ZIP mit der fertigen APK zum Download.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK einrichten
        # v3 (24.09.2026 zuletzt aktualisiert 09.11.2024) versucht intern noch das laengst aus dem
        # Android-SDK-Repository entfernte Legacy-Paket "tools" zu installieren und bricht dabei mit
        # "Failed to find package 'tools'" komplett ab - unabhaengig von jeder Code-Aenderung hier,
        # reine Umgebungs-Drift (Google hat das Paket zwischen dem letzten erfolgreichen Build am
        # 30.08.2026 und heute entfernt). v4 (zuletzt 17.09.2026) hat exakt diesen Fall bereits als
        # bekannten Sonderfall behandelt (übersprungen statt Abbruch) - gleiche Inputs/Outputs wie
        # v3, daher ohne weitere Anpassungen kompatibel.
        uses: android-actions/setup-android@v4

      - name: Festen Debug-Keystore einsetzen (sonst signiert jeder Build anders und Updates schlagen fehl)
        run: |
          mkdir -p ~/.android
          cp oma-martha-debug.keystore ~/.android/debug.keystore

      - name: Abhaengigkeiten installieren
        run: npm install

      - name: Android-Projekt generieren (legt android/ an)
        run: npx cap add android

      - name: Debug-Keystore EXPLIZIT im Gradle-Signing verdrahten (24.09.2026)
        # Christian: "ich muss auf dem Handy immer erst die bestehende Build deinstallieren,
        # bevor ich die neue installieren kann" - obwohl der feste Keystore oben schon nach
        # ~/.android/debug.keystore kopiert wird. Direkte Pruefung der zuletzt gebauten APK
        # (Build 24, Zertifikat entpackt+mit openssl gelesen) zeigte: "Not Before" = exakte
        # Build-Uhrzeit UND Subject "CN=Android Debug, O=Android, C=US" - das ist der von Android
        # Gradle Plugin SELBST automatisch neu generierte Debug-Schluessel, NICHT der feste
        # "CN=Oma Martha Debug"-Schluessel aus dem Repo. Der ~/.android/debug.keystore-Pfad wird
        # von AGP fuer dieses Projekt aus unbekanntem Grund offenbar nicht zuverlaessig genutzt -
        # deshalb jetzt zusaetzlich EXPLIZIT und eindeutig verdrahtet: Keystore direkt neben
        # build.gradle legen (kein globaler Pfad mehr noetig) und einen signingConfigs.debug-Block
        # mit exakt diesem Pfad einfuegen - ein per Namen "debug" definierter signingConfig
        # ersetzt bei AGP automatisch den eingebauten Standard, ohne dass buildTypes extra
        # angepasst werden muss. android-overrides/signing.gradle.snippet enthaelt den Block,
        # wird hier direkt nach der Zeile "android {" eingefuegt.
        run: |
          cp oma-martha-debug.keystore android/app/oma-martha-debug.keystore
          sed -i '/^android {/r android-overrides/signing.gradle.snippet' android/app/build.gradle

      - name: Minimale Android-Version auf 23 setzen (Zebra TC75x = Android 6.0)
        run: sed -i "s/minSdkVersion = .*/minSdkVersion = 23/" android/variables.gradle

      - name: Berechtigung fuer exakte Erinnerungs-Alarme ergaenzen (24.09.2026)
        # Christian: "warum meldet sich das TC52/Handy nicht puenktlich mit den Messpunkten" -
        # Capacitor LocalNotifications.schedule() nutzt intern AlarmManager, ab Android 12 braucht
        # ein EXAKTER Alarm (statt der vom System frei verschiebbaren Standard-Variante) diese
        # Berechtigung explizit im Manifest, sonst verzoegert das Betriebssystem geplante
        # Erinnerungen zusaetzlich zur Akku-Optimierung. SCHEDULE_EXACT_ALARM statt USE_EXACT_ALARM
        # gewaehlt (Letzteres verlangt eine Play-Store-Sonderfreigabe als "Wecker/Kalender-App",
        # fuer diese intern verteilte Debug-APK nicht relevant/erreichbar) - Nutzer muss die
        # Berechtigung einmalig unter Einstellungen -> Apps -> Sonderzugriff -> Alarme & Erinnerungen
        # freigeben, aehnlich wie bei der Akku-Optimierung.
        run: sed -i '/<uses-permission android:name="android.permission.INTERNET" \/>/a\    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />' android/app/src/main/AndroidManifest.xml

      - name: Build-Nummer als versionCode/versionName setzen (fuer den Update-Hinweis in der App)
        run: |
          sed -i "s/versionCode .*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"${{ github.run_number }}\"/" android/app/build.gradle

      - name: Force-Dark auf Aktivitaets-Ebene abschalten (24.09.2026)
        # Christian: "die Versionsnummer ist im Footer immer noch nicht da" (Samsung S23+) - der
        # CSS-Fix (color-scheme:light in style.css + Meta-Tag) reicht bei manchen WebViews NICHT
        # aus, weil Samsung/Android teils auf Aktivitaets-/System-Ebene zwangsverdunkelt (Force
        # Dark), unabhaengig von der Seiten-eigenen CSS-Angabe - das ist eine NATIVE Einstellung
        # der App-Huelle, keine reine Web-Angelegenheit. Ergaenzt android:forceDarkAllowed="false"
        # in JEDEM der 3 App-Themes (API 29+, aeltere Android-Versionen wie auf dem TC75x
        # ignorieren das Attribut einfach, kein Risiko dort) - deaktiviert die automatische
        # Farbumkehr fuer die komplette Activity. Bewusst alle 3 Themes statt nur eines: laut
        # Capacitor-Standardvorlage traegt <application> selbst "AppTheme", <activity
        # android:name=".MainActivity"> aber "AppTheme.NoActionBarLaunch" (Splash-Theme) -
        # ob/wann Capacitor zur Laufzeit zusaetzlich auf "AppTheme.NoActionBar" umschaltet, ist
        # von hier aus nicht sicher nachvollziehbar. Android-Styles mit eigenem "parent"-Attribut
        # erben NICHT automatisch von der Basis gleichen Namens trotz Punkt-Notation - alle 3
        # muessen daher einzeln getroffen werden, keine reicht allein sicher aus.
        run: sed -i '/<style name="AppTheme/a\        <item name="android:forceDarkAllowed">false</item>' android/app/src/main/res/values/styles.xml

      - name: DIAGNOSE - Tastendruck-Keycode als Toast anzeigen (24.09.2026, TEMPORAER)
        # Christian: "oberhalb des Scan-Triggers am TC52 ist eine Taste ohne Funktion, wofuer
        # koennte ich die benutzen" -> soll fest auf den Debug-Modus-Toggle gelegt werden, dafuer
        # muss aber erst der genaue Android-Keycode dieser Taste bekannt sein (je Zebra-Modell/
        # -Konfiguration unterschiedlich, raten waere riskant - koennte sonst z.B. mit dem
        # echten Scan-Trigger kollidieren). Kopiert eine feste, im Repo hinterlegte MainActivity
        # ueber die von "cap add android" generierte Standard-Version drueber (gleiches Prinzip
        # wie der feste Debug-Keystore oben) - zeigt bei JEDEM Tastendruck kurz den Keycode als
        # natives Android-Toast an, greift aber NICHT in die Verarbeitung ein (immer
        # super.dispatchKeyEvent() mit dessen echtem Ergebnis), der normale Scan-Trigger/
        # Zurueck-Taste etc. funktionieren dabei unveraendert weiter. Nach Identifikation durch
        # die feste Debug-Modus-Verdrahtung ersetzen, siehe imbiss_tc52_freie_taste_debug_modus.md.
        run: cp android-overrides/MainActivity.diagnose.java android/app/src/main/java/de/frankleben/omamartha/MainActivity.java

      - name: App-Icon aus assets/icon.png generieren
        run: npx @capacitor/assets generate --android

      - name: Konfiguration synchronisieren
        run: npx cap sync android

      - name: APK bauen (Debug, ungeeignet fuer Play Store aber fuer eigene Geraete ausreichend)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: oma-martha-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: APK auf festen Download-Link hochladen
        run: |
          curl -sf -X POST \
            -H "X-Upload-Secret: ${{ secrets.APK_UPLOAD_SECRET }}" \
            -H "X-Apk-Build: ${{ github.run_number }}" \
            --data-binary @android/app/build/outputs/apk/debug/app-debug.apk \
            https://oma-martha-frankleben.de/imbiss/modules/it_soloution/apk_upload.php
